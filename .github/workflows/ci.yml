# Tests nanoui on every push to main and every pull request: the line
# limit, the unit and widget tests on macOS (Metal, and nanoui's own text
# and CPU renderer), the Linux tests under a virtual display, and the
# Windows build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build lines
      - run: zig build test
      - run: zig build test -Dportable=true
      - run: zig build -Dtarget=x86_64-windows-gnu --prefix zig-out/windows

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: GTK, Mesa's OpenGL (llvmpipe), fonts and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libegl1 libegl-mesa0 libgl1-mesa-dri fonts-dejavu-core fonts-noto-core xvfb xauth zsh
      - run: zig build test-bin --prefix zig-out/linux
      - run: xvfb-run -a zig-out/linux/bin/nanoui-tests
