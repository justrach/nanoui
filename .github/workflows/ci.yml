# Tests nanoui on every push to main and every pull request: the line
# limit, the unit and widget tests on macOS (Metal, and nanoui's own text
# and CPU renderer) with builds for Windows and iOS, the Linux tests under
# a virtual display (OpenGL and OpenGL ES by Mesa) with a build for
# Android, and the Windows tests on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build lines
      - run: zig build test
      - run: zig build test -Dportable=true
      - run: zig build -Dtarget=x86_64-windows-gnu --prefix zig-out/windows
      # Windows on Arm too: COM's function pointers are aligned there.
      - run: zig build -Dtarget=aarch64-windows-gnu --prefix zig-out/windows-arm64
      - run: zig build test-nui
      - name: nui makes an app that builds, passes its test and renders
        run: |
          zig build nui
          nui="$PWD/zig-out/bin/nui"
          "$nui" start ci-app --dir "$RUNNER_TEMP/ci-app" --local "$PWD"
          cd "$RUNNER_TEMP/ci-app" && "$nui" test && "$nui" snapshot --out shot.png --script "click:Increment" --json
      # iOS needs Zig's lib fixed (the flag goes first) and Xcode's SDKs.
      - run: zig build $(sh tools/ios/zig-lib.sh) -Dtarget=aarch64-ios-simulator --prefix zig-out/ios-sim
      - run: zig build $(sh tools/ios/zig-lib.sh) -Dtarget=aarch64-ios --prefix zig-out/ios
      - run: zig build $(sh tools/ios/zig-lib.sh) test-bundle -Dtarget=aarch64-ios-simulator

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: GTK, WebKitGTK, Mesa's OpenGL and OpenGL ES (llvmpipe), fonts and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libgtk-4-1 libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri fonts-dejavu-core fonts-noto-core xvfb xauth zsh
      - run: zig build test-bin --prefix zig-out/linux
      # GTK 4 with WebKitGTK 6.0; the page's test then runs under GTK 3 with 4.1.
      - run: xvfb-run -a zig-out/linux/bin/nanoui-tests
      - run: NANOUI_GTK=3 xvfb-run -a zig-out/linux/bin/nanoui-tests
      # A live window under each GTK: GTK 4 where it's installed, GTK 3 when asked.
      - name: The counter under GTK 4 and GTK 3
        run: |
          zig build
          for v in 4 3; do
            NANOUI_GTK=$v NANOUI_DEBUG=1 timeout 4 xvfb-run -a zig-out/bin/counter > gtk$v.txt 2>&1 || true
            grep -q "nanoui: GTK $v" gtk$v.txt || { cat gtk$v.txt; exit 1; }
          done
      # A real page, sandbox as the system leaves it: its client served, a call
      # to Zig and back. In each world 6.0's sandbox can or can't start.
      - name: The hello page where bubblewrap can and can't run
        run: |
          js='import("/nanoui.js").then(async (m) => { nanoui.log(await m.Greeter.greet("Ada")); nanoui.window.close(); })'
          page() {
            NANOUI_DEBUG=1 timeout 90 xvfb-run -a zig-out/bin/hello --nanoui-wait=60 "--nanoui-eval=$js" > page$1.txt 2>&1 || { cat page$1.txt; exit 1; }
            grep -q "nanoui: GTK $1" page$1.txt && grep -q "page: Hello, Ada!" page$1.txt || { cat page$1.txt; exit 1; }
          }
          # Ubuntu's restriction: bwrap refuses, 6.0 would abort, so 4.1 and GTK 3.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          page 3
          # Without it: 6.0 and GTK 4, in bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          page 4
          # Restricted with only 6.0: the app lives and says why.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo dpkg -r --force-depends libwebkit2gtk-4.1-0
          timeout 40 xvfb-run -a zig-out/bin/hello --nanoui-wait=5 --nanoui-eval=0 > notice.txt 2>&1 || { cat notice.txt; exit 1; }
          grep -q "nanoui: bubblewrap can't run here, and WebKitGTK 6.0 needs it" notice.txt || { cat notice.txt; exit 1; }
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0
      - run: zig build test-nui
      - name: nui makes an app that builds, passes its test and renders
        run: |
          zig build nui
          nui="$PWD/zig-out/bin/nui"
          "$nui" doctor
          "$nui" start ci-app --dir "$RUNNER_TEMP/ci-app" --local "$PWD"
          cd "$RUNNER_TEMP/ci-app" && xvfb-run -a "$nui" test && xvfb-run -a "$nui" snapshot --out shot.png --script "click:Increment" --json
      # Android: the runner has its SDK, NDK and Java (ANDROID_HOME, ANDROID_NDK_HOME).
      - run: zig build -Dtarget=aarch64-linux-android
      - run: zig build test-tools

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Tests write their pictures to /tmp: on Windows, \tmp on this drive.
      - run: New-Item -ItemType Directory -Force -Path \tmp | Out-Null
      # Run directly, each test named (Direct3D's says whether it ran or skipped).
      - run: zig build test-bin --prefix zig-out/windows
      - run: zig-out/windows/bin/nanoui-tests.exe
      - run: zig build test-nui
      - name: nui makes an app that builds, passes its test and renders
        run: |
          zig build nui
          if ($LASTEXITCODE) { throw "nui didn't build" }
          $nui = "$PWD\zig-out\bin\nui.exe"
          & $nui start ci-app --dir "$env:RUNNER_TEMP\ci-app" --local "$PWD"
          if ($LASTEXITCODE) { throw "nui start failed" }
          Set-Location "$env:RUNNER_TEMP\ci-app"
          & $nui test
          if ($LASTEXITCODE) { throw "nui test failed" }
          & $nui snapshot --out shot.png --script "click:Increment" --json
          if ($LASTEXITCODE) { throw "nui snapshot failed" }
