<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nanoui · WebGPU counter</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fafafa}canvas{display:block;width:100%;height:100%;touch-action:none}p{font:16px system-ui;padding:24px}</style>
<canvas id="canvas" aria-label="nanoui counter"></canvas>
<script type="module">
import { start } from './nanoui.js';
try {
  const canvas = document.querySelector('canvas');
  const gallery = new URLSearchParams(location.search).get('app') === 'gallery';
  if (gallery) {
    document.title = 'nanoui · WebGPU Gallery';
    canvas.tabIndex = 0;
    canvas.setAttribute('aria-label', 'nanoui Gallery');
  }
  const keyboard = gallery ? e => {
    if (e.key === 'Tab') return false;
    if (e.getModifierState('AltGraph')) return Array.from(e.key).length === 1;
    if (e.altKey && (Array.from(e.key).length !== 1 || e.ctrlKey || e.metaKey)) return false;
    if (e.ctrlKey || e.metaKey) return e.key.toLowerCase() === 'k';
    return !e.key.startsWith('F') || e.key.length === 1;
  } : undefined;
  window.nanoui = await start({
    canvas, url: gallery ? './gallery.wasm' : './counter.wasm',
    keyboard, onError: console.error,
  });
} catch (error) {
  document.body.replaceChildren(Object.assign(document.createElement('p'),{textContent:error.message}));
  console.error(error);
}
</script></html>
