<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nanoui · WebGPU counter</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fafafa}canvas{display:block;width:100%;height:100%;touch-action:none}p{font:16px system-ui;padding:24px}</style>
<canvas id="canvas" aria-label="nanoui counter"></canvas>
<script type="module">
import { start } from './nanoui.js';
try {
  window.nanoui = await start({ canvas: document.querySelector('canvas'), url:`./${new URLSearchParams(location.search).get('app') === 'gallery' ? 'gallery' : 'counter'}.wasm`, onError: console.error });
} catch (error) {
  document.body.replaceChildren(Object.assign(document.createElement('p'),{textContent:error.message}));
  console.error(error);
}
</script></html>
